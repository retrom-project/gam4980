name: Core quality and release
on:
  pull_request:
    branches: ["retrom/geeaa531b55e7"]
  push:
    tags: ["retrom-core-geeaa531b55e7-r*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify archive tool
        run: command -v 7z
      - name: Validate release identity
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          remote_tag_ref="refs/retrom-release/$GITHUB_REF_NAME"
          git fetch origin "refs/tags/$GITHUB_REF_NAME:$remote_tag_ref"
          test "$(git cat-file -t "$remote_tag_ref")" = tag
          test "$(git rev-list -n 1 "$remote_tag_ref")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin 'refs/heads/retrom/geeaa531b55e7:refs/remotes/origin/retrom/geeaa531b55e7'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/retrom/geeaa531b55e7
      - name: Build and verify core
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/core-release"
          tag=retrom-core-geeaa531b55e7-r1-rc.1
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          python3 .github/rpg-runtime/build-release.py --output "$RUNNER_TEMP/core-release" --tag "$tag"
      - uses: actions/upload-artifact@v4
        with:
          name: core-release
          path: ${{ runner.temp }}/core-release/*
          if-no-files-found: error
      - name: Publish immutable release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/core-release/"* --verify-tag --generate-notes "${flags[@]}"
